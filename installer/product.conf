# Names used by the packaging scripts (installer/mac/make-pkg.sh, installer/windows/make-setup.sh)
PRODUCT="EPS-16 Plus Emulator"        # display name (Start menu, Applications folder, uninstall list)
SHORT=EPS16                           # plug-in bundles: EPS16.vst3, EPS16.component
APP="EPS-16-Plus.app"                 # macOS app
EXE=eps16                             # eps16.exe / eps16-cli(.exe)
ID=org.eps16emu                       # macOS package identifiers
ZIPBASE=EPS16-Plus-Emulator           # file names of the packages
CFGDIR=EPS16emu                       # per-user settings folder (Ensoniq/EPS16emu)
DATA_DIRS="roms scsi flashbank"       # folders next to the program that the user writes to
